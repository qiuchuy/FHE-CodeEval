# FHE-CodeEval benchmark registry.
#
# Each benchmark id is `{category}/{case_name}` using the four categories in
# the paper. `seed_id` preserves the run-branch id used to derive deterministic
# test-input seeds. `sampling_strategy` is either `uniform` (every sample uses
# the full declared range) or `stratified` (samples use equal-width subranges).
#
# input_specs fields:
#   name:  argument name matching the torch_kernel signature
#   shape: list of ints (tensor shape)
#   dtype: float32 | int64
#   range: [min, max] (for random generation)
#   type:  tensor (default) | scalar (passed as Python int/float, not tensor)
#   value: fixed value (only for type: scalar)
#   role:  ciphertext (default) | plaintext

- id: packing-oriented-operators/matmul
  seed_id: linear/matmul
  sampling_strategy: uniform
  category: packing-oriented-operators
  name: matmul
  torch_ref: benchmarks/packing-oriented-operators/matmul/ref.py
  description: Matrix multiply (128x64) @ (64x128) [Rotom]
  n_test_inputs: 5
  input_specs:
    - name: a
      shape:
        - 128
        - 64
      dtype: float32
      range:
        - -1
        - 1
      role: ciphertext
    - name: b
      shape:
        - 64
        - 128
      dtype: float32
      range:
        - -1
        - 1
      role: plaintext
  accuracy:
    atol: 0.01
    rtol: 0.01
